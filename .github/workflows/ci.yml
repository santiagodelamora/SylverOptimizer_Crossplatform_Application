name: Build & Verify (Windows & Android)

on:
  push:
    branches:
      - desarrollo
      - estable
  pull_request:
    branches:
      - desarrollo
      - estable

jobs:
  build-windows:
    name: Build WPF App (Windows x64 / .NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout repository / Descargar código
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK / Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies / Restaurar dependencias
        working-directory: windows
        run: dotnet restore SylverOptimizer.csproj

      - name: Build Release / Compilar en modo Release
        working-directory: windows
        run: dotnet build SylverOptimizer.csproj --configuration Release --no-restore

  build-android:
    name: Build Android App (Kotlin / Jetpack Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository / Descargar código
        uses: actions/checkout@v4

      - name: Setup JDK 17 / Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 / Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Release Keystore (Optional) / Preparar firma opcional
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK / Compilar APK en modo Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SylverOptimizer_Android_preview_${GITHUB_SHA::7}.apk"

      - name: Upload Android Preview APK / Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: SylverOptimizer-Android-Preview-APK
          path: android/app/build/outputs/apk/release/SylverOptimizer_Android_preview_*.apk

