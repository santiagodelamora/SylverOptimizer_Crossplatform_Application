name: Release Installer (Inno Setup 6)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository / Descargar código
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK / Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Win-x64 / Publicar ejecutable autocontenido
        run: |
          dotnet publish WinOptimizerPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Compile Installer with Inno Setup 6 / Compilar instalador .exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "Installer\WinOptimizerPro.iss"

      - name: Upload Installer Artifact / Subir artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-Installer
          path: Installer/Output/*.exe

      - name: Create GitHub Release / Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/Output/*.exe
          generate_release_notes: true
