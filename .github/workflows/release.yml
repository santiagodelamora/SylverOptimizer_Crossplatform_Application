name: Release Installers (Windows .exe & Android .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository / Descargar código
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK / Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Win-x64 / Publicar ejecutable autocontenido
        working-directory: windows
        run: |
          dotnet publish SylverOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Compile Installer with Inno Setup 6 / Compilar instalador .exe
        working-directory: windows
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "Installer\SylverOptimizer.iss"

      - name: Upload Windows Installer Artifact / Subir instalador de Windows
        uses: actions/upload-artifact@v4
        with:
          name: SylverOptimizer-Windows-Installer
          path: windows/Installer/Output/*.exe

  release-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository / Descargar código
        uses: actions/checkout@v4

      - name: Setup JDK 17 / Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 / Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Release Keystore (Optional) / Preparar firma opcional
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK / Compilar APK en modo Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_TAG="${GITHUB_REF_NAME:-v1.1.0}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="v1.1.0"
          fi
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SylverOptimizer_Android_${VERSION_TAG}.apk"

      - name: Upload Android APK Artifact / Subir APK de Android
        uses: actions/upload-artifact@v4
        with:
          name: SylverOptimizer-Android-APK
          path: android/app/build/outputs/apk/release/SylverOptimizer_Android_*.apk

  publish-release:
    name: Publish GitHub Release (.exe & .apk)
    needs:
      - release-windows
      - release-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Artifacts / Descargar instaladores compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release / Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "SylverOptimizer ${{ github.ref_name }} — Windows & Android"
          files: |
            release-assets/**/*.exe
            release-assets/**/*.apk
          generate_release_notes: true
          body: |
            🇪🇸 **Lanzamiento oficial multiplataforma de SylverOptimizer (${{ github.ref_name }})**
            - 🖥️ **Windows 10 / 11 (x64):** Instalador autocontenido `.exe` (no requiere instalar .NET por separado).
            - 📱 **Android 8.0+ (API 26–35):** Aplicación nativa `.apk` escrita en Kotlin y Jetpack Compose.

            🇺🇸 **Official cross-platform release of SylverOptimizer (${{ github.ref_name }})**
            - 🖥️ **Windows 10 / 11 (x64):** Self-contained `.exe` installer (no separate .NET runtime required).
            - 📱 **Android 8.0+ (API 26–35):** Native `.apk` application built with Kotlin and Jetpack Compose.
